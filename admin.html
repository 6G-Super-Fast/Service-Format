<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSC Admin Dashboard ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: #0f1319; 
            background-image: radial-gradient(circle at top right, #1a1a2e, #0f1319);
            color: #c9d1d9; 
            font-family: 'Poppins', sans-serif; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-box { 
            background: #161b22; 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 100%;
            max-width: 550px; 
            border: 1px solid #00d4ff; 
            text-align: center; 
            box-shadow: 0 15px 35px rgba(0, 212, 255, 0.15);
            position: relative;
            overflow: hidden;
        }

        .admin-box::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ea77, #00d4ff);
        }

        h2, h3 { color: #fff; font-weight: 700; letter-spacing: 1px; margin-bottom: 5px; }
        h2 i, h3 i { color: #00ea77; margin-right: 8px; }
        .subtitle { color: #8b949e; font-size: 13px; font-weight: 500; margin-bottom: 25px; font-family: 'Inter', sans-serif; }

        .input-pro { 
            width: 100%; padding: 15px 20px; margin-bottom: 15px; 
            background: #010409; color: #fff; 
            border: 1px solid #30363d; border-radius: 10px; 
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        .input-pro::placeholder { color: #6e7681; }
        .input-pro:focus { 
            border-color: #00d4ff; 
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2); 
            outline: none; 
        }

        select.input-pro {
            cursor: pointer;
        }

        textarea.input-pro {
            resize: vertical;
            line-height: 1.5;
        }

        .btn-pro { 
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 15px; margin-bottom: 15px;
            border: none; border-radius: 10px; 
            cursor: pointer; font-weight: 700; font-size: 14px; 
            transition: all 0.3s ease; text-transform: uppercase;
            font-family: 'Poppins', sans-serif; letter-spacing: 0.5px;
        }
        
        .btn-green { background: #00ea77; color: #000; box-shadow: 0 4px 15px rgba(0, 234, 119, 0.2); }
        .btn-green:hover { background: #00ff88; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 234, 119, 0.4); }
        
        .btn-yellow { background: #d29922; color: #fff; box-shadow: 0 4px 15px rgba(210, 153, 34, 0.2); }
        .btn-yellow:hover { background: #e3b341; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(210, 153, 34, 0.4); }
        
        .btn-blue { background: #1f6feb; color: #fff; box-shadow: 0 4px 15px rgba(31, 111, 235, 0.2); margin-bottom: 0;}
        .btn-blue:hover { background: #388bfd; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31, 111, 235, 0.4); }

        .action-btns button {
            padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer;
            font-weight: 600; font-size: 12px; transition: 0.3s; color: #fff;
        }
        .btn-edit { background: #9e6a03; margin-right: 8px; }
        .btn-edit:hover { background: #d29922; }
        .btn-delete { background: #da3633; }
        .btn-delete:hover { background: #f85149; }

        /* GRID ENTRY CARD */
        .list-item { 
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            align-items: center; 
            gap: 14px;
            margin-bottom: 12px; 
            padding: 14px 16px; 
            background: #0d1117; 
            border-radius: 10px; 
            border: 1px solid #30363d; 
            text-align: left; 
            cursor: grab; 
            transition: 0.3s ease;
        }
        .list-item:hover { border-color: #8b949e; background: #161b22; }
        .list-item:active { cursor: grabbing; }
        .list-item.dragging { opacity: 0.4; background: #21262d; border: 1px dashed #00ea77; }
        .list-item.drag-over { border-top: 3px solid #00d4ff; transform: scale(1.02); }
        
        .drag-icon { color: #8b949e; font-size: 16px; display: flex; align-items: center; justify-content: center; width: 18px; }

        /* SEPARATE S.NO BADGE */
        .sno-badge {
            background: #00d4ff;
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 42px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 212, 255, 0.25);
        }

        .sno-badge.manual-badge {
            background: #00ea77;
            box-shadow: 0 2px 8px rgba(0, 234, 119, 0.25);
        }

        .item-text-wrap {
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
        }

        .item-sub {
            font-size: 12px;
            color: #8b949e;
            margin-top: 2px;
        }

        .modal-section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            margin: 22px 0 12px 0;
            padding-bottom: 6px;
            border-bottom: 1px solid #30363d;
            text-align: left;
        }
        .modal-section-title.gov { color: #00d4ff; }
        .modal-section-title.manual { color: #00ea77; }

        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-content { background: #161b22; padding: 30px; border-radius: 16px; border: 1px solid #00d4ff; width: 95%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 15px 50px rgba(0,0,0,0.6); animation: popIn 0.3s ease-out; }
        
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; margin-bottom: 15px; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 20px; display: flex; align-items: center; gap: 10px;}
        .close-btn { color: #da3633; font-size: 28px; font-weight: bold; cursor: pointer; background: none; border: none; transition: 0.3s; }
        .close-btn:hover { color: #ff4757; transform: rotate(90deg); }
        
        #serviceListContainer { overflow-y: auto; padding-right: 10px; flex-grow: 1; }
        ::-webkit-scrollbar { width: 8px; height: 8px;}
        ::-webkit-scrollbar-track { background: #010409; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b949e; }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div class="admin-box" id="loginSection">
        <h2><i class="fa-solid fa-building-shield"></i> CSC Admin Portal</h2>
        <p class="subtitle">Secure Control Room for Shop Services</p>
        
        <button type="button" class="btn-pro btn-green" style="margin-top: 15px;" onclick="loadDataFromCloud()">
            <i class="fa-solid fa-right-to-bracket"></i> ENTER ADMIN PANEL
        </button>
    </div>

    <!-- Main Editor Section -->
    <div class="admin-box" id="editorSection" style="display:none; padding-top: 30px;">
        <h3 id="formTitle"><i class="fa-solid fa-file-circle-plus"></i> Add New Service Format</h3>
        <p class="subtitle" style="margin-bottom: 20px;">Add service name and details for the public to view.</p>
        
        <div style="display: flex; gap: 10px;">
            <input type="text" id="sNoInput" class="input-pro" placeholder="S. No." style="width: 30%; text-align:center; font-weight: bold;">
            <select id="categoryInput" class="input-pro" style="width: 70%; font-weight: bold; color: #00d4ff;" onchange="autoSuggestSNo()">
                <option value="gov" selected>🏛️ Government Service</option>
                <option value="manual">⚙️ Manual Service</option>
            </select>
        </div>

        <textarea id="serviceNameInput" class="input-pro" placeholder="Service Name (Press Enter for multi-line)" style="min-height: 54px; margin-bottom: 15px;"></textarea>
        
        <textarea id="formatDetailsInput" class="input-pro" placeholder="Type format process & required documents here..." style="min-height: 120px;"></textarea>
        
        <button type="button" id="actionBtn" class="btn-pro btn-green" onclick="processServiceEntry()">
            <i class="fa-solid fa-plus"></i> ADD SERVICE
        </button>
        
        <hr style="border: none; border-top: 1px solid #30363d; margin: 25px 0;">

        <button type="button" class="btn-pro btn-yellow" onclick="openModal()">
            <i class="fa-solid fa-list-check"></i> VIEW SERVICES & EDIT
        </button>
        
        <button type="button" class="btn-pro btn-blue" onclick="saveToCloud()">
            <i class="fa-solid fa-cloud-arrow-up"></i> SAVE TO SERVER
        </button>
        
        <button type="button" class="btn-pro" style="background: #da3633; color: #fff; margin-top: 15px;" onclick="logoutAdmin()">
            <i class="fa-solid fa-right-from-bracket"></i> LOGOUT
        </button>
    </div>

    <!-- View Data List Modal -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-list"></i> ALL CSC SERVICES LIST</h3>
                <button type="button" class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="subtitle" style="text-align: left; margin-top:-5px; margin-bottom: 10px;">💡 Drag & Drop to reorder entries within list.</p>
            <div id="serviceListContainer"></div>
        </div>
    </div>

    <script>
        const TOKEN_PART_1 = "ghp_ib4h4kWYgpi9tp7N"; 
        const TOKEN_PART_2 = "WAmVKpx0IU4Gtk18s8tG"; 
        const GIT_TOKEN = TOKEN_PART_1 + TOKEN_PART_2; 
        
        const myRepo = "6G-Super-Fast/Service-Format"; 
        
        let serviceArray = [];
        let editIndex = null; 
        let fileSha = "";
        let dragStartIndex = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isCscAdminLoggedIn') === 'true') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('editorSection').style.display = 'block';
                loadDataFromCloudSilent();
            }
        });

        async function loadDataFromCloudSilent() {
            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json?t=` + new Date().getTime(), {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    const parsedData = JSON.parse(decodedData);
                    serviceArray = parsedData.filter(item => item.service_name); 
                    autoSuggestSNo();
                }
            } catch (error) {
                console.log("Sync check error");
            }
        }

        async function loadDataFromCloud() {
            const loginBtn = document.querySelector('#loginSection .btn-green');
            loginBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> CONNECTING...";

            try {
                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json?t=` + new Date().getTime(), {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                
                if(response.ok) {
                    const data = await response.json();
                    fileSha = data.sha;
                    const decodedData = decodeURIComponent(escape(atob(data.content)));
                    const parsedData = JSON.parse(decodedData);
                    serviceArray = parsedData.filter(item => item.service_name); 
                    
                    sessionStorage.setItem('isCscAdminLoggedIn', 'true');
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('editorSection').style.display = 'block';
                    autoSuggestSNo();
                } else {
                    throw new Error("Failed");
                }
            } catch (error) {
                loginBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Internal error, try after some time";
                loginBtn.style.background = "#da3633";
                loginBtn.style.color = "#fff";
                setTimeout(() => {
                    loginBtn.innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
                    loginBtn.style.background = "#00ea77";
                    loginBtn.style.color = "#000";
                }, 3000);
            }
        }

        function logoutAdmin() {
            sessionStorage.removeItem('isCscAdminLoggedIn');
            document.getElementById('editorSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.querySelector('#loginSection .btn-green').innerHTML = "<i class='fa-solid fa-right-to-bracket'></i> ENTER ADMIN PANEL";
        }

        // Auto suggest based on selected category count
        function autoSuggestSNo() {
            const currentCat = document.getElementById('categoryInput').value;
            const filtered = serviceArray.filter(item => {
                const isManual = item.category === 'manual' || (item.service_name && item.service_name.toUpperCase().includes("MANUAL"));
                return currentCat === 'manual' ? isManual : !isManual;
            });
            document.getElementById('sNoInput').value = filtered.length + 1;
        }

        async function processServiceEntry() {
            const s_no = document.getElementById('sNoInput').value.trim();
            const category = document.getElementById('categoryInput').value;
            let service_name = document.getElementById('serviceNameInput').value.trim();
            const format_details = document.getElementById('formatDetailsInput').value.trim();
            const actionBtn = document.getElementById('actionBtn');

            if(!s_no || !service_name || !format_details) { 
                actionBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> FILL ALL FIELDS ⚠️";
                actionBtn.style.background = "#d29922";
                setTimeout(() => {
                    actionBtn.innerHTML = "<i class='fa-solid fa-plus'></i> ADD SERVICE";
                    actionBtn.style.background = "#00ea77";
                    actionBtn.style.color = "#000";
                }, 2000);
                return; 
            }

            if (!service_name.includes("⚡")) {
                service_name += " ⚡";
            }

            if(editIndex === null) {
                serviceArray.push({ s_no, category, service_name, format_details });
            } else {
                serviceArray[editIndex] = { s_no, category, service_name, format_details };
                editIndex = null;
                document.getElementById('formTitle').innerHTML = "<i class='fa-solid fa-file-circle-plus'></i> Add New Service Format";
                document.getElementById('actionBtn').className = "btn-pro btn-green";
            }

            document.getElementById('serviceNameInput').value = "";
            document.getElementById('formatDetailsInput').value = "";
            document.getElementById('categoryInput').value = "gov";
            autoSuggestSNo();

            actionBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> SAVED TO LIST ✅";
            actionBtn.style.background = "#00ea77";
            actionBtn.style.color = "#000";

            setTimeout(() => {
                actionBtn.innerHTML = "<i class='fa-solid fa-plus'></i> ADD SERVICE";
                actionBtn.style.background = "#00ea77";
                actionBtn.style.color = "#000";
            }, 2000);
        }

        async function openModal() { 
            document.getElementById('listModal').style.display = 'flex'; 
            const container = document.getElementById('serviceListContainer');
            container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 20px;"><i class="fa-solid fa-spinner fa-spin"></i> Fetching live records...</div>';
            
            await loadDataFromCloudSilent();
            renderServiceListLocal();
        }

        function createListItemHTML(item, index, displayNumber, isManual) {
            let sName = (item.service_name || "Old Format Entry").replace(/\n/g, ' ');

            return `
                <div class="list-item" draggable="true" data-index="${index}">
                    <span class="drag-icon"><i class="fa-solid fa-grip-vertical"></i></span>
                    <span class="sno-badge ${isManual ? 'manual-badge' : ''}">#${displayNumber}</span>
                    <div class="item-text-wrap">
                        <div class="item-title">${sName}</div>
                        <div class="item-sub">Format Data Logged</div>
                    </div>
                    <div class="action-btns">
                        <button type="button" class="btn-edit" onclick="editService(${index})"><i class="fa-solid fa-pen"></i></button>
                        <button type="button" class="btn-delete" onclick="deleteService(${index})"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>`;
        }

        function renderServiceListLocal() {
            const container = document.getElementById('serviceListContainer');
            container.innerHTML = "";
            if (!serviceArray || serviceArray.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #8b949e; padding: 30px;">No records found.</div>';
                return;
            }

            let govItems = [];
            let manualItems = [];

            serviceArray.forEach((item, index) => {
                const isManual = item.category === 'manual' || (item.service_name && item.service_name.toUpperCase().includes("MANUAL"));
                if (isManual) {
                    manualItems.push({ item, index });
                } else {
                    govItems.push({ item, index });
                }
            });

            let fullHtml = "";

            // Gov Services reset to #1
            if (govItems.length > 0) {
                fullHtml += `
                    <div class="modal-section-title gov">
                        <i class="fa-solid fa-building-columns"></i> GOV SERVICES (${govItems.length})
                    </div>
                `;
                govItems.forEach((entry, idx) => {
                    fullHtml += createListItemHTML(entry.item, entry.index, idx + 1, false);
                });
            }

            // Manual Services reset to #1
            if (manualItems.length > 0) {
                fullHtml += `
                    <div class="modal-section-title manual">
                        <i class="fa-solid fa-gears"></i> MANUAL SERVICES (${manualItems.length})
                    </div>
                `;
                manualItems.forEach((entry, idx) => {
                    fullHtml += createListItemHTML(entry.item, entry.index, idx + 1, true);
                });
            }

            container.innerHTML = fullHtml;
            addDragAndDropListeners();
        }

        function updateSerialNumbers() {
            let govCount = 1;
            let manCount = 1;
            serviceArray.forEach((item) => {
                const isManual = item.category === 'manual' || (item.service_name && item.service_name.toUpperCase().includes("MANUAL"));
                if(isManual) {
                    item.s_no = (manCount++).toString();
                } else {
                    item.s_no = (govCount++).toString();
                }
            });
        }

        function addDragAndDropListeners() {
            const draggables = document.querySelectorAll('.list-item');
            draggables.forEach(draggable => {
                draggable.addEventListener('dragstart', function(e) { 
                    dragStartIndex = +this.getAttribute('data-index'); 
                    this.classList.add('dragging'); 
                });
                draggable.addEventListener('dragover', function(e) { e.preventDefault(); });
                draggable.addEventListener('dragenter', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
                draggable.addEventListener('dragleave', function() { this.classList.remove('drag-over'); });
                draggable.addEventListener('drop', function(e) { 
                    e.preventDefault();
                    this.classList.remove('drag-over'); 
                    const dragEndIndex = +this.getAttribute('data-index'); 
                    if (dragStartIndex !== null && dragStartIndex !== dragEndIndex) {
                        swapItems(dragStartIndex, dragEndIndex); 
                    }
                });
                draggable.addEventListener('dragend', function() { this.classList.remove('dragging'); });
            });
        }

        function swapItems(fromIndex, toIndex) {
            const itemToMove = serviceArray.splice(fromIndex, 1)[0];
            serviceArray.splice(toIndex, 0, itemToMove);
            renderServiceListLocal();
        }

        function editService(index) {
            editIndex = index;
            const item = serviceArray[index];
            document.getElementById('sNoInput').value = item.s_no || "";
            
            if (item.category) {
                document.getElementById('categoryInput').value = item.category;
            } else if (item.service_name && item.service_name.toUpperCase().includes("MANUAL")) {
                document.getElementById('categoryInput').value = "manual";
            } else {
                document.getElementById('categoryInput').value = "gov";
            }

            document.getElementById('serviceNameInput').value = item.service_name || "";
            document.getElementById('formatDetailsInput').value = item.format_details || "";
            
            document.getElementById('formTitle').innerHTML = `<i class='fa-solid fa-pen-to-square'></i> Edit Service #${item.s_no}`;
            document.getElementById('actionBtn').innerHTML = "<i class='fa-solid fa-check-double'></i> UPDATE SERVICE";
            document.getElementById('actionBtn').className = "btn-pro btn-yellow";
            closeModal(); 
        }

        async function deleteService(index) {
            serviceArray.splice(index, 1);
            renderServiceListLocal();
            autoSuggestSNo();
        }

        async function saveToCloud() {
            const uploadBtn = document.querySelector('.btn-blue');
            uploadBtn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> SAVING...";
            uploadBtn.style.background = "#d29922";

            try {
                updateSerialNumbers();

                const getRes = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json?t=` + new Date().getTime(), {
                    headers: { 'Authorization': `token ${GIT_TOKEN}` }
                });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    fileSha = fileData.sha;
                }

                const updatedJson = JSON.stringify(serviceArray, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(updatedJson)));

                const response = await fetch(`https://api.github.com/repos/${myRepo}/contents/data.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GIT_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: "Update CSC Services format list via Admin", 
                        content: encodedContent, 
                        sha: fileSha ? fileSha : undefined 
                    })
                });

                if(response.ok) {
                    const resData = await response.json();
                    fileSha = resData.content.sha;
                    
                    uploadBtn.innerHTML = "<i class='fa-solid fa-circle-check'></i> SAVED TO SERVER ✅";
                    uploadBtn.style.background = "#00ea77";
                    uploadBtn.style.color = "#000";

                    setTimeout(() => {
                        uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> SAVE TO SERVER";
                        uploadBtn.style.background = "#1f6feb";
                        uploadBtn.style.color = "#fff";
                    }, 3000);

                } else { 
                    throw new Error("Upload failed"); 
                }
            } catch (error) {
                uploadBtn.innerHTML = "<i class='fa-solid fa-triangle-exclamation'></i> Error, check console";
                uploadBtn.style.background = "#da3633";
                uploadBtn.style.color = "#fff";
                setTimeout(() => {
                    uploadBtn.innerHTML = "<i class='fa-solid fa-cloud-arrow-up'></i> SAVE TO SERVER";
                    uploadBtn.style.background = "#1f6feb";
                    uploadBtn.style.color = "#fff";
                }, 3000);
            }
        }

        function closeModal() { document.getElementById('listModal').style.display = 'none'; }
    </script>
</body>
</html>
